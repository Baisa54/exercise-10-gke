apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: node-registry
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: node-registry
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
